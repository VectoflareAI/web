name = "vectoflare-admin"
main = "src/index.ts"
compatibility_date = "2025-12-01"

# After deploying, add a route in Cloudflare Dashboard:
# Workers & Pages → vectoflare-admin → Triggers → Add Route
# Route: vectoflare.com/admin*
# Zone: your domain zone

[[kv_namespaces]]
binding = "admin_store"
id = "" # Run: npx wrangler kv:namespace create admin_store  → paste the ID here
